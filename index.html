<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>DM MotoStore</title>
</head>

<body>
    <header>

        <div class="Logo">
            <img src="src/img/logoDM-removebg-preview.png" alt="DM MotoStore Logo" />
        </div>

        <nav class="Menu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Categorias</a></li>
            </ul>
        </nav>

        <div class="Login">
            <div class="search-bar">
                <input type="text" placeholder="Buscar motos, peças e acessórios...">
                <button><i class="bi bi-search"></i></button>
            </div>
            <div class="login-button">
                <a href="#"><button type="button">Logar</button></a>
                <div class="register-button">
                    <a href=""><button type="button">Cadastrar</button></a>
                </div>
            </div>
        </div>
        </nav>
    </header>

    <section class="img-background">

        <div class="text-container">
            <div class="text-background">
                <h1>Bem-vindo à DM MotoStore</h1>
                <p>Encontre as melhores motos e acessórios para você!</p>
                <button class="btn">Ver Produtos</button>
            </div>

            <div class="img-container">
                <img src="src/img/img_moto.png" alt="">
            </div>
        </div>
    </section>

    <section class="categorias">
        <div class="categoria">
            <img src="src/img/hondalogo-removebg-preview.png" alt="Logo da Honda">
        </div>
        <div class="categoria">
            <img src="src/img/yamahalogo-removebg-preview.png" alt="Logo da Yamaha">
        </div>
        <div class="categoria">
            <img src="src/img/logosuzuki-removebg-preview.png" alt="Logo da Suzuki">
        </div>
        <div class="categoria">
            <img src="src/img/kawasakilogo-removebg-preview.png" alt="Logo da Kawasaki">
        </div>
    </section>

</body>

</html>
